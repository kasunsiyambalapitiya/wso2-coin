$kind: http-request
method: POST
url: '{{baseUrl}}/admin/orders/search'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "filters": {
        "status": "CONFIRMED",
        "pickupOfficeId": "{{pickupOfficeId}}",
        "searchQuery": "",
        "from": "2026-11-01",
        "to": "2026-12-31"
      },
      "pagination": {
        "limit": 50,
        "offset": 0
      }
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = pm.collectionVariables.get('orderNo') || ((json.items || [])[0] || {}).orderNo;
      if (value) { pm.collectionVariables.set('orderNo', value); }
    }
  language: text/javascript
order: 1000
